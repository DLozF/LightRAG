# Full Docker Compose Deployment Sample Generated by Setup Wizard: `make base` and `make storage`
# This Sample File requires NVIDIA GPU for Milvus and VLLM services.
# Copy `env.docker-compose-full` to `.env` before starting this compose file.
# You can customize your setup using the Setup Wizard; for detailed instructions, please refer to docs/InteractiveSetup.md
services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "9621:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./config.ini:/app/config.ini
      - ./data/prompts:/app/data/prompts
      # Optional user-defined UI content bundle (welcome page, login blurb
      # and user agreement, query empty state, brand logo). Read-only: the
      # server only ever reads it. See docs/UserDefinedUI.md.
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The container must listen on 0.0.0.0 to be reachable via the published port.
      # SECURITY: set LIGHTRAG_API_KEY (or AUTH_ACCOUNTS with TOKEN_SECRET) in .env
      # so the exposed server is authenticated — without it every endpoint is public.
      HOST: "0.0.0.0"
      PORT: "9621"
      # Loads user-defined UI content from the read-only bundle mounted above.
      # Inert until ./data/ui_templates holds a bundle: with no manifest.json
      # in it the server logs a warning and keeps the built-in LightRAG
      # branding. Once a manifest.json is there an invalid bundle makes the
      # server refuse to start. This entry deliberately overrides the same key
      # in the mounted .env, exactly like WORKING_DIR / INPUT_DIR / PROMPT_DIR:
      # .env holds host paths so one file can serve both a source run and this
      # deployment, and compose supplies the container path.
      # See docs/UserDefinedUI.md.
      UI_TEMPLATES_DIR: "/app/data/ui_templates"
      EMBEDDING_BINDING_HOST: "http://ollama:11434"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      NEO4J_URI: "neo4j://neo4j:7687"
      WORKING_DIR: "/app/data/rag_storage"
      QDRANT_URL: "http://qdrant:6333"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # MEMGRAPH_URI: "bolt://host.docker.internal:7687"
      # REDIS_URI: "redis://host.docker.internal:6379"
      # QDRANT_URL: "http://host.docker.internal:6333"
      # OPENSEARCH_HOSTS: "host.docker.internal:9200"
      # MONGO_URI: "mongodb://root:root@host.docker.internal:27017/"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mineru-api:
        condition: service_healthy



  postgres:
    # Official pgvector image: no Apache AGE, so PGGraphStorage cannot run here.
    # Use PGTableGraphStorage (recommended) for graph storage on plain tables, or
    # switch to gzdaniel/postgres-for-rag:pg18-age-pgvector if you need AGE.
    image: pgvector/pgvector:pg18
    networks:
    - backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 5432)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped
    environment:
      POSTGRES_USER: "rag"
      POSTGRES_PASSWORD: "rag"
      POSTGRES_DB: "rag"

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 7687)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 10s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?missing}/${NEO4J_PASSWORD:?missing}
      NEO4J_dbms_default__database: "neo4j"

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks:
      - backend
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 4

networks:
  backend:
    name: local-hermes_backend

volumes:
  postgres_data:
  neo4j_data:
  qdrant_storage:

